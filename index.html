<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B6E4F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>جمع البيانات الميدانية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap');
  * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
  html, body { margin: 0; padding: 0; background: #E9EEEA; }
  input, select, textarea, button { font-family: 'Tajawal', sans-serif; }
  input:focus, select:focus, textarea:focus, button:focus { outline: 2px solid #0B6E4F; outline-offset: 1px; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #C7D3CE; border-radius: 4px; }
  button { cursor: pointer; }

  .app-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #F7F9F7; display: flex; flex-direction: column; }
  .header { background: #0B6E4F; padding: 18px 16px; color: #fff; }
  .header-top { display: flex; align-items: center; gap: 12px; }
  .brand-ring { background: #fff; border-radius: 50%; padding: 2px; flex-shrink: 0; }
  .brand-title { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 17px; }
  .brand-sub { font-size: 12.5px; opacity: .9; margin-top: 3px; }
  .body { flex: 1; padding: 14px 14px 30px 14px; overflow-y: auto; }

  .section-card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05); margin-bottom: 12px; }
  .section-title { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 15px; color: #173B33; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .field-label { font-size: 12.5px; color: #5B6B67; font-weight: 700; margin-top: 10px; margin-bottom: 5px; display: block; }
  .select-field { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #E4E9E4; background: #fff; font-size: 13.5px; color: #173B33; }
  textarea.select-field { resize: none; min-height: 60px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid #E4E9E4; background: #fff; color: #5B6B67; border-radius: 20px; padding: 7px 14px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .chip-active { border: 1px solid #0B6E4F; background: #0B6E4F; color: #fff; border-radius: 20px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .chip-x { background: transparent; border: none; color: inherit; opacity: .7; font-size: 12px; padding: 0; line-height: 1; }
  .add-area-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-area-row input { flex: 1; }
  .small-btn { border: none; background: #0B6E4F; color: #fff; border-radius: 10px; padding: 0 14px; font-size: 13px; font-weight: 700; }

  .current-area-badge { background: #EAF5EE; color: #0B6E4F; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; font-weight: 700; text-align: center; }
  .current-area-empty { background: #FBEFDD; color: #C9862B; border-radius: 10px; padding: 8px 10px; font-size: 12px; text-align: center; }

  .photo-btn { width: 100%; border: 1.5px dashed #C7D3CE; background: #FAFCFA; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #5B6B67; font-size: 13px; margin-top: 10px; }
  .photo-preview-wrap { position: relative; margin-top: 10px; }
  .photo-preview { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; display: block; }
  .photo-remove { position: absolute; top: 8px; left: 8px; background: rgba(20,20,20,.55); color: #fff; border: none; border-radius: 8px; width: 28px; height: 28px; font-size: 14px; }

  .primary-btn { width: 100%; margin-top: 14px; background: #0B6E4F; color: #fff; border: none; border-radius: 10px; padding: 12px 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .primary-btn:disabled { background: #A9BDB6; }
  .export-btn { width: 100%; background: #0B6E4F; color: #fff; border: none; border-radius: 10px; padding: 13px 0; font-size: 14.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .ghost-btn { width: 100%; margin-top: 8px; background: transparent; color: #C0483F; border: none; border-radius: 10px; padding: 9px 0; font-size: 12.5px; }

  .entry-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #F0F3F1; }
  .entry-row:last-child { border-bottom: none; }
  .entry-thumb { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; background: #EEF3EF; flex-shrink: 0; }
  .entry-thumb-placeholder { width: 54px; height: 54px; border-radius: 10px; background: #EEF3EF; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #B7C4BF; flex-shrink: 0; }
  .entry-info { flex: 1; min-width: 0; }
  .entry-shop { font-weight: 700; font-size: 13.5px; color: #173B33; }
  .entry-meta { font-size: 11.5px; color: #8A9A96; margin-top: 2px; }
  .entry-notes { font-size: 12px; color: #5B6B67; margin-top: 3px; }
  .entry-del { border: none; background: transparent; color: #C0483F; font-size: 14px; align-self: flex-start; padding: 4px; }
  .empty-state { text-align: center; color: #8A9A96; font-size: 13px; padding: 20px 10px; }
  .count-badge { background: #EAF5EE; color: #0B6E4F; border-radius: 20px; padding: 2px 10px; font-size: 11.5px; font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------------- Helpers ---------------- */
function uid(p){ return p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function todayHuman(){
  const WEEKDAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  const d = new Date();
  return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
}
function esc(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- State ---------------- */
let areas = [];
let entries = [];
let currentAreaId = '';
let currentPhoto = null; // {dataUrl, width, height}

function loadData(){
  try {
    const raw = localStorage.getItem('fielddata-data');
    if (raw) {
      const d = JSON.parse(raw);
      areas = d.areas || [];
      entries = d.entries || [];
      currentAreaId = d.currentAreaId || '';
    }
  } catch (e) { console.error('load error', e); }
}
function saveData(){
  try { localStorage.setItem('fielddata-data', JSON.stringify({areas, entries, currentAreaId})); }
  catch (e) { alert('تعذر حفظ البيانات على هذا الجهاز، مساحة التخزين ممكن تكون امتلأت. جرّب تصدّر وتمسح بيانات اليوم.'); }
}

/* ---------------- Areas ---------------- */
function addArea(){
  const input = document.getElementById('new-area-input');
  const name = input.value.trim();
  if (!name) { alert('اكتب اسم المنطقة في الخانة الأول، وبعدين اضغط "+ إضافة"'); return; }
  if (areas.some(a => a.name === name)) { alert('هذه المنطقة مسجلة بالفعل'); return; }
  const area = {id: uid('a'), name};
  areas.push(area);
  currentAreaId = area.id;
  saveData(); render();
}
function selectArea(id){
  currentAreaId = (currentAreaId === id) ? '' : id;
  saveData(); render();
}
function deleteArea(id){
  const area = areas.find(a => a.id === id);
  if (!area) return;
  const count = entries.filter(e => e.areaId === id).length;
  const msg = count > 0
    ? ('هذه المنطقة مرتبطة بـ ' + count + ' سجل بيانات. حذفها لن يمسح السجلات لكنها ستفقد اسم منطقتها. متابعة؟')
    : 'حذف هذه المنطقة؟';
  if (!confirm(msg)) return;
  areas = areas.filter(a => a.id !== id);
  if (currentAreaId === id) currentAreaId = '';
  saveData(); render();
}

/* ---------------- Photo capture ---------------- */
function triggerPhoto(){
  document.getElementById('photo-input').click();
}
function compressImage(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({dataUrl: canvas.toDataURL('image/jpeg', quality), width: w, height: h});
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function handlePhotoInput(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  compressImage(file, 1000, 0.72).then((result) => {
    currentPhoto = result;
    render();
  }).catch(() => alert('تعذر معالجة الصورة'));
  event.target.value = '';
}
function removeCurrentPhoto(){
  currentPhoto = null;
  render();
}

/* ---------------- Entries ---------------- */
function addEntry(){
  if (!currentAreaId) { alert('اختر منطقة أولاً من الأعلى (أو أضف منطقة جديدة)'); return; }
  const shopName = document.getElementById('entry-shop').value.trim();
  const clientName = document.getElementById('entry-client').value.trim();
  const phone = document.getElementById('entry-phone').value.trim();
  const address = document.getElementById('entry-address').value.trim();
  const status = document.getElementById('entry-status').value;
  const notes = document.getElementById('entry-notes').value.trim();
  if (!shopName) { alert('أدخل اسم المحل'); return; }
  if (!clientName) { alert('أدخل اسم العميل'); return; }
  if (!status) { alert('اختر الحالة (يعمل / لا يعمل)'); return; }
  entries.push({
    id: uid('e'),
    areaId: currentAreaId,
    shopName,
    clientName,
    phone,
    address,
    status,
    notes,
    photo: currentPhoto,
    time: new Date().toISOString()
  });
  currentPhoto = null;
  saveData(); render();
}
function deleteEntry(id){
  if (!confirm('حذف هذا السجل من القائمة؟')) return;
  entries = entries.filter(e => e.id !== id);
  saveData(); render();
}
function resetDay(){
  if (entries.length === 0) { alert('لا توجد بيانات لمسحها'); return; }
  if (!confirm('هل تريد مسح كل بيانات اليوم المسجلة؟ (المناطق المسجلة هتفضل زي ما هي، تقدر تصدّر تقرير الإكسيل الأول لو محتاج تحتفظ بالبيانات)')) return;
  entries = [];
  saveData(); render();
}

/* ---------------- Export ---------------- */
function periodEntries(){
  return entries.slice().sort((a,b) => new Date(a.time) - new Date(b.time));
}
async function exportReport(){
  if (entries.length === 0) { alert('لا توجد بيانات مسجلة لتصديرها بعد'); return; }
  const btn = document.getElementById('export-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري إنشاء التقرير...'; }
  try {
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('تقرير اليوم', {views: [{rightToLeft: true}]});
    ws.columns = [
      {header: 'م', key: 'idx', width: 5},
      {header: 'المنطقة', key: 'area', width: 18},
      {header: 'اسم المحل', key: 'shop', width: 22},
      {header: 'اسم العميل', key: 'client', width: 20},
      {header: 'رقم التليفون', key: 'phone', width: 15},
      {header: 'العنوان', key: 'address', width: 24},
      {header: 'الحالة', key: 'status', width: 12},
      {header: 'ملاحظات', key: 'notes', width: 26},
      {header: 'الوقت', key: 'time', width: 10},
      {header: 'الصورة', key: 'photo', width: 18}
    ];
    const headerRow = ws.getRow(1);
    headerRow.font = {bold: true, color: {argb: 'FFFFFFFF'}};
    headerRow.alignment = {horizontal: 'center', vertical: 'middle'};
    headerRow.eachCell((cell) => {
      cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF0B6E4F'}};
    });
    headerRow.height = 22;

    const sorted = periodEntries();
    const THUMB = 100;
    sorted.forEach((e, i) => {
      const area = areas.find(a => a.id === e.areaId);
      const rowNum = i + 2;
      const statusText = e.status === 'working' ? 'يعمل ✅' : (e.status === 'not_working' ? 'لا يعمل ❌' : '-');
      const row = ws.addRow({
        idx: i + 1,
        area: area ? area.name : '-',
        shop: e.shopName,
        client: e.clientName || '-',
        phone: e.phone || '-',
        address: e.address || '-',
        status: statusText,
        notes: e.notes || '-',
        time: fmtTime(e.time)
      });
      row.alignment = {vertical: 'middle', wrapText: true, horizontal: 'right'};
      row.height = 78;

      if (e.photo && e.photo.dataUrl) {
        const base64 = e.photo.dataUrl.split(',')[1];
        const imgId = wb.addImage({base64, extension: 'jpeg'});
        let w = e.photo.width || THUMB, h = e.photo.height || THUMB;
        const scale = Math.min(THUMB / w, THUMB / h, 1);
        const ext = {width: Math.round(w * scale), height: Math.round(h * scale)};
        ws.addImage(imgId, {
          tl: {col: 9, row: rowNum - 1},
          ext,
          editAs: 'oneCell'
        });
      }
    });

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], {type: 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'تقرير اليوم.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    console.error(err);
    alert('حدث خطأ أثناء إنشاء ملف الإكسيل. جرّب تاني.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📊 تصدير تقرير اليوم'; }
  }
}

/* ---------------- Render ---------------- */
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  document.getElementById('root').innerHTML = buildApp();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

function buildApp(){
  return '<div class="app-shell">'
    + buildHeader()
    + '<div class="body">'
    + buildAreasSection()
    + buildEntryFormSection()
    + buildEntriesListSection()
    + buildExportSection()
    + '</div></div>';
}

function buildHeader(){
  return '<div class="header"><div class="header-top">'
    + '<div class="brand-ring"><svg width="44" height="44" viewBox="0 0 44 44">'
    + '<circle cx="22" cy="22" r="22" fill="#0B6E4F"/>'
    + '<text x="22" y="29" text-anchor="middle" font-size="20">📋</text>'
    + '</svg></div>'
    + '<div style="flex:1"><div class="brand-title">جمع البيانات الميدانية</div>'
    + '<div class="brand-sub">' + todayHuman() + ' &middot; ' + entries.length + ' سجل حتى الآن</div></div>'
    + '</div></div>';
}

function buildAreasSection(){
  const sorted = areas.slice().sort((a,b) => a.name.localeCompare(b.name, 'ar'));
  return '<div class="section-card">'
    + '<div class="section-title"><span>المناطق</span></div>'
    + '<div class="add-area-row">'
    + '<input id="new-area-input" class="select-field" placeholder="اسم منطقة جديدة، مثال: حي الأربعين" onkeydown="if(event.key===\'Enter\'){addArea();}">'
    + '<button class="small-btn" onclick="addArea()">+ إضافة</button>'
    + '</div>'
    + '<div style="margin-top:12px">' + (sorted.length === 0
        ? '<div class="empty-state">لسه مفيش مناطق مسجلة. اكتب اسم منطقة فوق واضغط "+ إضافة".</div>'
        : '<div class="chip-row">' + sorted.map(buildAreaChip).join('') + '</div>')
    + '</div>'
    + '<div style="margin-top:10px">' + (currentAreaId
        ? '<div class="current-area-badge">📍 المنطقة الحالية: ' + esc((areas.find(a=>a.id===currentAreaId)||{}).name || '') + '</div>'
        : '<div class="current-area-empty">اضغط على منطقة من فوق لتحديدها كمنطقة حالية قبل إضافة بيانات</div>')
    + '</div>'
    + '</div>';
}

function buildAreaChip(a){
  const active = a.id === currentAreaId;
  return '<span class="' + (active ? 'chip-active' : 'chip') + '">'
    + '<span onclick="selectArea(\'' + a.id + '\')" style="cursor:pointer">' + esc(a.name) + '</span>'
    + '<button class="chip-x" onclick="deleteArea(\'' + a.id + '\')" title="حذف المنطقة">✕</button>'
    + '</span>';
}

function buildEntryFormSection(){
  return '<div class="section-card">'
    + '<div class="section-title"><span>بيانات جديدة</span></div>'
    + '<label class="field-label">اسم المحل</label>'
    + '<input id="entry-shop" class="select-field" placeholder="مثال: محل الأمانة للموبايلات">'
    + '<label class="field-label">اسم العميل</label>'
    + '<input id="entry-client" class="select-field" placeholder="مثال: أحمد محمد">'
    + '<label class="field-label">رقم التليفون (اختياري)</label>'
    + '<input id="entry-phone" type="tel" class="select-field" placeholder="01xxxxxxxxx">'
    + '<label class="field-label">العنوان (اختياري)</label>'
    + '<input id="entry-address" class="select-field" placeholder="مثال: شارع 10 - عمارة 5">'
    + '<label class="field-label">الحالة</label>'
    + '<select id="entry-status" class="select-field">'
    + '<option value="">اختر الحالة</option>'
    + '<option value="working">🟢 يعمل</option>'
    + '<option value="not_working">🔴 لا يعمل</option>'
    + '</select>'
    + '<label class="field-label">ملاحظات (اختياري)</label>'
    + '<textarea id="entry-notes" class="select-field"></textarea>'
    + '<input id="photo-input" type="file" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoInput(event)">'
    + (currentPhoto
        ? '<div class="photo-preview-wrap"><img class="photo-preview" src="' + currentPhoto.dataUrl + '">'
          + '<button class="photo-remove" onclick="removeCurrentPhoto()">✕</button></div>'
        : '<button class="photo-btn" onclick="triggerPhoto()"><span style="font-size:22px">📷</span><span>التقاط صورة للمحل</span></button>')
    + '<button class="primary-btn" onclick="addEntry()">➕ إضافة للسجل</button>'
    + '</div>';
}

function buildEntriesListSection(){
  const sorted = periodEntries().slice().reverse();
  return '<div class="section-card">'
    + '<div class="section-title"><span>سجل اليوم</span><span class="count-badge">' + entries.length + '</span></div>'
    + (sorted.length === 0
        ? '<div class="empty-state">لسه مفيش بيانات مسجلة النهاردة.</div>'
        : sorted.map(buildEntryRow).join(''))
    + '</div>';
}

function buildEntryRow(e){
  const area = areas.find(a => a.id === e.areaId);
  const statusLabel = e.status === 'working' ? '🟢 يعمل' : (e.status === 'not_working' ? '🔴 لا يعمل' : '');
  return '<div class="entry-row">'
    + (e.photo && e.photo.dataUrl
        ? '<img class="entry-thumb" src="' + e.photo.dataUrl + '">'
        : '<div class="entry-thumb-placeholder">📄</div>')
    + '<div class="entry-info">'
    + '<div class="entry-shop">' + esc(e.shopName) + (e.clientName ? ' — ' + esc(e.clientName) : '') + '</div>'
    + '<div class="entry-meta">📍 ' + esc(area ? area.name : '-') + ' &middot; 🕐 ' + fmtTime(e.time) + (statusLabel ? ' &middot; ' + statusLabel : '') + '</div>'
    + (e.phone ? '<div class="entry-notes">📞 ' + esc(e.phone) + '</div>' : '')
    + (e.address ? '<div class="entry-notes">🏠 ' + esc(e.address) + '</div>' : '')
    + (e.notes ? '<div class="entry-notes">' + esc(e.notes) + '</div>' : '')
    + '</div>'
    + '<button class="entry-del" onclick="deleteEntry(\'' + e.id + '\')">🗑</button>'
    + '</div>';
}

function buildExportSection(){
  return '<div class="section-card">'
    + '<div class="section-title"><span>تصدير التقرير</span></div>'
    + '<button id="export-btn" class="export-btn" onclick="exportReport()">📊 تصدير تقرير اليوم</button>'
    + '<button class="ghost-btn" onclick="resetDay()">🗑 بدء يوم جديد (مسح بيانات اليوم)</button>'
    + '</div>';
}

/* ---------------- Init ---------------- */
loadData();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => console.log('SW registration failed', e));
  });
}
</script>
