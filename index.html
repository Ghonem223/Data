<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>جمع البيانات الميدانية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap');
  * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
  html, body { margin: 0; padding: 0; background: #0B120F; }
  input, select, textarea, button { font-family: 'Tajawal', sans-serif; }
  input:focus, select:focus, textarea:focus, button:focus { outline: 2px solid #1D9E75; outline-offset: 1px; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #2E3D38; border-radius: 4px; }
  button { cursor: pointer; }

  .app-shell { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #14201C; display: flex; flex-direction: column; }
  .header { background: #14201C; padding: 18px 16px 12px; color: #F2F4F1; border-bottom: 0.5px solid #22302A; }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand-ring { background: #1D9E75; border-radius: 11px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
  .brand-title { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 15.5px; color: #F2F4F1; }
  .brand-sub { font-size: 11.5px; color: #7C8C86; margin-top: 2px; }
  .header-stats { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .header-stat { flex: 1; min-width: 70px; background: #1B2925; border-radius: 12px; padding: 10px; text-align: center; }
  .header-stat-num { font-size: 18px; font-weight: 700; }
  .header-stat-label { font-size: 10.5px; color: #7C8C86; margin-top: 2px; }

  .body { flex: 1; padding: 14px 14px 90px 14px; overflow-y: auto; }

  .section-card { background: #1B2925; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .section-title { font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 14.5px; color: #F2F4F1; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
  .field-label { font-size: 12px; color: #7C8C86; font-weight: 700; margin-top: 10px; margin-bottom: 5px; display: block; }
  .select-field { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #2E3D38; background: #16231F; font-size: 13.5px; color: #F2F4F1; }
  .select-field::placeholder { color: #5C6D67; }
  textarea.select-field { resize: none; min-height: 60px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid #2E3D38; background: #16231F; color: #B9C4BF; border-radius: 20px; padding: 7px 14px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .chip-active { border: 1px solid #1D9E75; background: #1D9E75; color: #08130F; border-radius: 20px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .chip-x { background: transparent; border: none; color: inherit; opacity: .7; font-size: 12px; padding: 0; line-height: 1; }
  .add-area-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-area-row input { flex: 1; }
  .small-btn { border: none; background: #1D9E75; color: #08130F; border-radius: 10px; padding: 0 14px; font-size: 13px; font-weight: 700; }

  .current-area-badge { background: #0F3B2E; color: #5DCAA5; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; font-weight: 700; text-align: center; }
  .current-area-empty { background: #2E230A; color: #EF9F27; border-radius: 10px; padding: 8px 10px; font-size: 12px; text-align: center; }

  .photo-btn { width: 100%; border: 1.5px dashed #3A4A44; background: #16231F; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #B9C4BF; font-size: 13px; margin-top: 10px; }
  .photo-preview-wrap { position: relative; margin-top: 10px; }
  .photo-preview { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; display: block; }
  .photo-remove { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 8px; width: 28px; height: 28px; font-size: 14px; }

  .primary-btn { width: 100%; margin-top: 14px; background: #1D9E75; color: #08130F; border: none; border-radius: 10px; padding: 12px 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .primary-btn:disabled { background: #2E3D38; color: #7C8C86; }
  .export-btn { width: 100%; background: #1D9E75; color: #08130F; border: none; border-radius: 10px; padding: 13px 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .export-btn-outline { width: 100%; background: transparent; color: #5DCAA5; border: 1px solid #2E4A40; border-radius: 10px; padding: 12px 0; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; }
  .ghost-btn { width: 100%; margin-top: 8px; background: transparent; color: #E24B4A; border: none; border-radius: 10px; padding: 9px 0; font-size: 12.5px; }

  .vr-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .vr-chip { border: 1.5px solid #2E3D38; background: #16231F; color: #B9C4BF; border-radius: 20px; padding: 8px 14px; font-size: 12.5px; font-weight: 700; }
  .vr-chip-down { border-color: #1D9E75; color: #5DCAA5; }
  .vr-chip-down.vr-active { background: #1D9E75; color: #08130F; }
  .vr-chip-active { border-color: #378ADD; color: #7CB2EE; }
  .vr-chip-active.vr-active { background: #378ADD; color: #08171F; }
  .vr-chip-think { border-color: #EF9F27; color: #EF9F27; }
  .vr-chip-think.vr-active { background: #EF9F27; color: #241a05; }
  .vr-chip-reject { border-color: #E24B4A; color: #F0908F; }
  .vr-chip-reject.vr-active { background: #E24B4A; color: #200606; }
  .visit-badge { display: inline-block; border-radius: 20px; padding: 2px 9px; font-size: 11px; font-weight: 700; }
  .visit-badge-down { background: #0F3B2E; color: #5DCAA5; }
  .visit-badge-active { background: #10263A; color: #7CB2EE; }
  .visit-badge-think { background: #2E230A; color: #EF9F27; }
  .visit-badge-reject { background: #34181A; color: #F0908F; }

  .entry-row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid #22302A; }
  .entry-row:last-child { border-bottom: none; }
  .entry-thumb { width: 54px; height: 54px; border-radius: 10px; object-fit: cover; background: #22302A; flex-shrink: 0; }
  .entry-thumb-placeholder { width: 54px; height: 54px; border-radius: 10px; background: #22302A; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #5C6D67; flex-shrink: 0; }
  .entry-info { flex: 1; min-width: 0; }
  .entry-shop { font-weight: 700; font-size: 13.5px; color: #F2F4F1; }
  .entry-meta { font-size: 11.5px; color: #7C8C86; margin-top: 2px; }
  .entry-notes { font-size: 12px; color: #B9C4BF; margin-top: 3px; }
  .entry-del { border: none; background: transparent; color: #E24B4A; font-size: 14px; align-self: flex-start; padding: 4px; }
  .empty-state { text-align: center; color: #7C8C86; font-size: 13px; padding: 20px 10px; }
  .count-badge { background: #0F3B2E; color: #5DCAA5; border-radius: 20px; padding: 2px 10px; font-size: 11.5px; font-weight: 700; }

  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #1B2925; border-top: 0.5px solid #2E3D38; display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
  .nav-btn { flex: 1; background: transparent; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; font-size: 10.5px; color: #7C8C86; }
  .nav-btn-icon { font-size: 18px; }
  .nav-btn.active { color: #5DCAA5; }

  .stat-bar-row { margin-bottom: 12px; }
  .stat-bar-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; }
  .stat-bar-track { background: #16231F; border-radius: 20px; height: 8px; overflow: hidden; }
  .stat-bar-fill { height: 100%; border-radius: 20px; }

  .followup-select { padding: 8px 10px; border-radius: 10px; border: 1px solid #2E3D38; background: #16231F; color: #F2F4F1; font-size: 12.5px; }
  .followup-card { background: #16231F; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 0.5px solid #22302A; }
  .followup-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .followup-actions { display: flex; gap: 6px; margin-top: 10px; }
  .followup-mini-btn { flex: 1; border: 1px solid #2E3D38; background: transparent; color: #B9C4BF; border-radius: 8px; padding: 7px 0; font-size: 11.5px; }
  .followup-mini-btn.contacted { border-color: #1D9E75; color: #5DCAA5; background: #0F3B2E; }
  .followup-note { background: #1B2925; border-radius: 8px; padding: 7px 9px; font-size: 11.5px; color: #B9C4BF; margin-top: 6px; }
  .followup-note-date { color: #7C8C86; font-size: 10.5px; margin-bottom: 2px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------------- Helpers ---------------- */
function uid(p){ return p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
const WEEKDAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function todayHuman(){
  const d = new Date();
  return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.getDate() + ' ' + MONTHS[d.getMonth()];
}
function esc(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function isSameDay(a, b){
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function startOfWeek(d){ // week starts Saturday (Middle East convention)
  const day = d.getDay(); // 0=Sunday..6=Saturday
  const diff = (day + 1) % 7; // days since last Saturday
  const s = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diff);
  s.setHours(0,0,0,0);
  return s;
}
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function monthLabelFromKey(key){
  const [y, m] = key.split('-').map(Number);
  return MONTHS[m - 1] + ' ' + y;
}

/* ---------------- Visit result options ---------------- */
const VISIT_RESULTS = {
  down:     {label: 'إنزال',       chipClass: 'vr-chip-down',    badgeClass: 'visit-badge-down',    emoji: '✅', color: '#5DCAA5'},
  active:   {label: 'شغال معانا',  chipClass: 'vr-chip-active',  badgeClass: 'visit-badge-active',  emoji: '🤝', color: '#7CB2EE'},
  thinking: {label: 'هيفكر',       chipClass: 'vr-chip-think',   badgeClass: 'visit-badge-think',   emoji: '⏳', color: '#EF9F27'},
  rejected: {label: 'رفض',         chipClass: 'vr-chip-reject',  badgeClass: 'visit-badge-reject',  emoji: '❌', color: '#F0908F'}
};

/* ---------------- State ---------------- */
let areas = [];
let entries = [];
let currentAreaId = '';
let currentPhoto = null; // {dataUrl, width, height}
let currentVisitResult = ''; // 'down' | 'active' | 'thinking' | 'rejected'
let entryDraft = {shopName: '', clientName: '', phone: '', address: '', notes: ''};
let currentTab = 'home'; // 'home' | 'followup' | 'reports'
let selectedFollowupMonth = monthKey(new Date());
let followUpDraftFor = null;
let followUpDraftText = '';

function loadData(){
  try {
    const raw = localStorage.getItem('fielddata-data');
    if (raw) {
      const d = JSON.parse(raw);
      areas = d.areas || [];
      entries = d.entries || [];
      currentAreaId = d.currentAreaId || '';
    }
  } catch (e) { console.error('load error', e); }
  entries.forEach((e) => {
    if (!Array.isArray(e.followUps)) e.followUps = [];
    if (typeof e.contacted !== 'boolean') e.contacted = false;
  });
}
function saveData(){
  try { localStorage.setItem('fielddata-data', JSON.stringify({areas, entries, currentAreaId})); }
  catch (e) { alert('تعذر حفظ البيانات على هذا الجهاز، مساحة التخزين ممكن تكون امتلأت. جرّب تصدّر وتمسح بيانات قديمة.'); }
}

/* ---------------- Tabs ---------------- */
function setTab(tab){
  currentTab = tab;
  render();
}

/* ---------------- Areas ---------------- */
function addArea(){
  const input = document.getElementById('new-area-input');
  const name = input.value.trim();
  if (!name) { alert('اكتب اسم المنطقة في الخانة الأول، وبعدين اضغط "+ إضافة"'); return; }
  if (areas.some(a => a.name === name)) { alert('هذه المنطقة مسجلة بالفعل'); return; }
  const area = {id: uid('a'), name};
  areas.push(area);
  currentAreaId = area.id;
  saveData(); render();
}
function selectArea(id){
  currentAreaId = (currentAreaId === id) ? '' : id;
  saveData(); render();
}
function deleteArea(id){
  const area = areas.find(a => a.id === id);
  if (!area) return;
  const count = entries.filter(e => e.areaId === id).length;
  const msg = count > 0
    ? ('هذه المنطقة مرتبطة بـ ' + count + ' سجل بيانات. حذفها لن يمسح السجلات لكنها ستفقد اسم منطقتها. متابعة؟')
    : 'حذف هذه المنطقة؟';
  if (!confirm(msg)) return;
  areas = areas.filter(a => a.id !== id);
  if (currentAreaId === id) currentAreaId = '';
  saveData(); render();
}

/* ---------------- Photo capture ---------------- */
function triggerPhoto(){
  document.getElementById('photo-input').click();
}
function compressImage(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({dataUrl: canvas.toDataURL('image/jpeg', quality), width: w, height: h});
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function handlePhotoInput(event){
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  compressImage(file, 1000, 0.72).then((result) => {
    currentPhoto = result;
    render();
  }).catch(() => alert('تعذر معالجة الصورة'));
  event.target.value = '';
}
function removeCurrentPhoto(){
  currentPhoto = null;
  render();
}
function selectVisitResult(value){
  currentVisitResult = (currentVisitResult === value) ? '' : value;
  render();
}

/* ---------------- Entries ---------------- */
function addEntry(){
  if (!currentAreaId) { alert('اختر منطقة أولاً من الأعلى (أو أضف منطقة جديدة)'); return; }
  const shopName = document.getElementById('entry-shop').value.trim();
  const clientName = document.getElementById('entry-client').value.trim();
  const phone = document.getElementById('entry-phone').value.trim();
  const address = document.getElementById('entry-address').value.trim();
  const notes = document.getElementById('entry-notes').value.trim();
  if (!shopName) { alert('أدخل اسم المحل'); return; }
  if (!clientName) { alert('أدخل اسم العميل'); return; }
  if (!currentVisitResult) { alert('اختر نتيجة الزيارة (إنزال / شغال معانا / هيفكر / رفض)'); return; }
  entries.push({
    id: uid('e'),
    areaId: currentAreaId,
    shopName,
    clientName,
    phone,
    address,
    visitResult: currentVisitResult,
    notes,
    photo: currentPhoto,
    time: new Date().toISOString(),
    followUps: [],
    contacted: false
  });
  currentPhoto = null;
  currentVisitResult = '';
  entryDraft = {shopName: '', clientName: '', phone: '', address: '', notes: ''};
  saveData(); render();
}
function deleteEntry(id){
  if (!confirm('حذف هذا السجل من القائمة؟')) return;
  entries = entries.filter(e => e.id !== id);
  saveData(); render();
}
function resetDay(){
  const todayCount = todayEntries().length;
  if (todayCount === 0) { alert('لا توجد بيانات مسجلة اليوم لمسحها'); return; }
  if (!confirm('هل تريد مسح بيانات اليوم بس (' + todayCount + ' سجل)؟ بيانات الأيام السابقة هتفضل محفوظة للتقارير والمتابعة.')) return;
  const now = new Date();
  entries = entries.filter(e => !isSameDay(new Date(e.time), now));
  saveData(); render();
}

/* ---------------- Follow-up notes ---------------- */
function toggleContacted(id){
  const e = entries.find(x => x.id === id);
  if (!e) return;
  e.contacted = !e.contacted;
  saveData(); render();
}
function startFollowUp(id){
  followUpDraftFor = id;
  followUpDraftText = '';
  render();
}
function cancelFollowUp(){
  followUpDraftFor = null;
  followUpDraftText = '';
  render();
}
function saveFollowUp(id){
  const text = (followUpDraftText || '').trim();
  if (!text) { alert('اكتب الملاحظة الأول'); return; }
  const e = entries.find(x => x.id === id);
  if (!e) return;
  if (!Array.isArray(e.followUps)) e.followUps = [];
  e.followUps.push({id: uid('f'), date: new Date().toISOString(), text});
  followUpDraftFor = null;
  followUpDraftText = '';
  saveData(); render();
}

/* ---------------- Period helpers ---------------- */
function allSorted(){
  return entries.slice().sort((a,b) => new Date(a.time) - new Date(b.time));
}
function todayEntries(){
  const now = new Date();
  return allSorted().filter(e => isSameDay(new Date(e.time), now));
}
function weekEntries(){
  const start = startOfWeek(new Date());
  return allSorted().filter(e => new Date(e.time) >= start);
}
function monthEntries(){
  const start = startOfMonth(new Date());
  return allSorted().filter(e => new Date(e.time) >= start);
}
function countByResult(list){
  const counts = {down: 0, active: 0, thinking: 0, rejected: 0};
  list.forEach((e) => { if (counts[e.visitResult] !== undefined) counts[e.visitResult]++; });
  return counts;
}

/* ---------------- Export ---------------- */
async function buildAndDownloadWorkbook(list, filename, sheetLabel){
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(sheetLabel, {views: [{rightToLeft: true}]});
  const COLS = [
    {header: 'م', key: 'idx', width: 5},
    {header: 'التاريخ', key: 'date', width: 11},
    {header: 'المنطقة', key: 'area', width: 18},
    {header: 'اسم المحل', key: 'shop', width: 22},
    {header: 'اسم العميل', key: 'client', width: 20},
    {header: 'رقم التليفون', key: 'phone', width: 15},
    {header: 'العنوان', key: 'address', width: 24},
    {header: 'نتيجة الزيارة', key: 'visitResult', width: 14},
    {header: 'ملاحظات', key: 'notes', width: 26},
    {header: 'الوقت', key: 'time', width: 10},
    {header: 'الصورة', key: 'photo', width: 18}
  ];
  ws.columns = COLS;
  const COL_COUNT = COLS.length;
  const PHOTO_COL_INDEX = COL_COUNT - 1;

  const headerRow = ws.getRow(1);
  headerRow.font = {bold: true, color: {argb: 'FFFFFFFF'}};
  headerRow.alignment = {horizontal: 'center', vertical: 'middle'};
  headerRow.eachCell((cell) => {
    cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF0B6E4F'}};
  });
  headerRow.height = 22;

  const sorted = list.slice().sort((a,b) => new Date(a.time) - new Date(b.time));
  const downEntries = sorted.filter(e => e.visitResult === 'down' || e.visitResult === 'active');
  const otherEntries = sorted.filter(e => e.visitResult !== 'down' && e.visitResult !== 'active');
  const THUMB = 100;
  let rowCursor = 2;
  let globalIdx = 0;

  function addSectionTitle(title, fillArgb, fontArgb){
    const r = ws.getRow(rowCursor);
    r.getCell(1).value = title;
    ws.mergeCells(rowCursor, 1, rowCursor, COL_COUNT);
    r.font = {bold: true, size: 12, color: {argb: fontArgb}};
    r.alignment = {horizontal: 'center', vertical: 'middle'};
    r.height = 20;
    r.eachCell({includeEmpty: true}, (cell) => {
      cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: fillArgb}};
    });
    rowCursor++;
  }

  function addEntryRows(items, rowFillArgb){
    items.forEach((e) => {
      const area = areas.find(a => a.id === e.areaId);
      const vr = VISIT_RESULTS[e.visitResult];
      globalIdx++;
      const thisRowNum = rowCursor;
      const row = ws.getRow(thisRowNum);
      row.values = {
        idx: globalIdx,
        date: fmtDate(e.time),
        area: area ? area.name : '-',
        shop: e.shopName,
        client: e.clientName || '-',
        phone: e.phone || '-',
        address: e.address || '-',
        visitResult: vr ? (vr.emoji + ' ' + vr.label) : '-',
        notes: e.notes || '-',
        time: fmtTime(e.time)
      };
      row.alignment = {vertical: 'middle', wrapText: true, horizontal: 'right'};
      row.height = 78;
      if (rowFillArgb) {
        row.eachCell({includeEmpty: true}, (cell) => {
          cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: rowFillArgb}};
        });
      }
      if (e.photo && e.photo.dataUrl) {
        const base64 = e.photo.dataUrl.split(',')[1];
        const imgId = wb.addImage({base64, extension: 'jpeg'});
        let w = e.photo.width || THUMB, h = e.photo.height || THUMB;
        const scale = Math.min(THUMB / w, THUMB / h, 1);
        const ext = {width: Math.round(w * scale), height: Math.round(h * scale)};
        ws.addImage(imgId, {tl: {col: PHOTO_COL_INDEX, row: thisRowNum - 1}, ext, editAs: 'oneCell'});
      }
      rowCursor++;
    });
  }

  addSectionTitle('✅ إنزال / 🤝 شغال معانا (' + downEntries.length + ')', 'FFDCEFE1', 'FF0B6E4F');
  if (downEntries.length === 0) {
    const r = ws.getRow(rowCursor);
    r.getCell(1).value = 'لا توجد سجلات في هذا القسم';
    ws.mergeCells(rowCursor, 1, rowCursor, COL_COUNT);
    r.alignment = {horizontal: 'center'};
    r.font = {italic: true, color: {argb: 'FF8A9A96'}};
    rowCursor++;
  } else {
    addEntryRows(downEntries, 'FFF3FAF6');
  }
  rowCursor++;
  addSectionTitle('⏳ هيفكر / ❌ رفض (' + otherEntries.length + ')', 'FFFBE9D8', 'FFA66A00');
  if (otherEntries.length === 0) {
    const r = ws.getRow(rowCursor);
    r.getCell(1).value = 'لا توجد سجلات في هذا القسم';
    ws.mergeCells(rowCursor, 1, rowCursor, COL_COUNT);
    r.alignment = {horizontal: 'center'};
    r.font = {italic: true, color: {argb: 'FF8A9A96'}};
    rowCursor++;
  } else {
    addEntryRows(otherEntries, 'FFFDF6EC');
  }

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], {type: 'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function exportPeriod(period){
  let list, filename, sheetLabel, btnId;
  if (period === 'today') { list = todayEntries(); filename = 'تقرير اليوم.xlsx'; sheetLabel = 'تقرير اليوم'; btnId = 'export-btn-today'; }
  else if (period === 'week') { list = weekEntries(); filename = 'تقرير الأسبوع.xlsx'; sheetLabel = 'تقرير الأسبوع'; btnId = 'export-btn-week'; }
  else { list = monthEntries(); filename = 'تقرير الشهر.xlsx'; sheetLabel = 'تقرير الشهر'; btnId = 'export-btn-month'; }

  if (list.length === 0) { alert('لا توجد بيانات مسجلة لهذه الفترة بعد'); return; }
  const btn = document.getElementById(btnId);
  const originalText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري إنشاء التقرير...'; }
  try {
    await buildAndDownloadWorkbook(list, filename, sheetLabel);
  } catch (err) {
    console.error(err);
    alert('حدث خطأ أثناء إنشاء ملف الإكسيل. جرّب تاني.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = originalText; }
  }
}

/* ---------------- Import ---------------- */
function triggerImportFile(){
  document.getElementById('import-file-input').click();
}
function arabicToLatinDigits(str){
  const map = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
  return String(str == null ? '' : str).replace(/[٠-٩]/g, (d) => map[d]);
}
function cleanCell(v){
  if (v == null) return '';
  const s = String(v).trim();
  return (s === '-' || s === '—') ? '' : s;
}
function parseVisitResultKey(text){
  const t = cleanCell(text);
  for (const key in VISIT_RESULTS) {
    if (t.indexOf(VISIT_RESULTS[key].label) !== -1) return key;
  }
  return null;
}
function parseArabicDateTime(dateText, timeText, year){
  try {
    const dParts = arabicToLatinDigits(cleanCell(dateText)).trim().split(/\s+/);
    const day = parseInt(dParts[0], 10);
    const monthIdx = MONTHS.indexOf(dParts[1]);
    if (!day || monthIdx === -1) return null;

    const tRaw = arabicToLatinDigits(cleanCell(timeText)).trim();
    const isPM = tRaw.indexOf('م') !== -1;
    const isAM = tRaw.indexOf('ص') !== -1;
    const tParts = tRaw.replace(/[صم]/g, '').trim().split(':');
    let hour = parseInt(tParts[0], 10);
    const minute = parseInt(tParts[1], 10) || 0;
    if (isNaN(hour)) hour = 12;
    if (isPM && hour !== 12) hour += 12;
    if (isAM && hour === 12) hour = 0;

    const d = new Date(year, monthIdx, day, hour, minute);
    if (isNaN(d.getTime())) return null;
    return d;
  } catch (e) { return null; }
}
function findOrCreateAreaByName(name){
  const clean = cleanCell(name);
  if (!clean) return currentAreaId || (areas[0] && areas[0].id) || '';
  let area = areas.find(a => a.name === clean);
  if (!area) {
    area = {id: uid('a'), name: clean};
    areas.push(area);
  }
  return area.id;
}
async function handleImportFile(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if (!file) return;

  const yearInput = prompt('السجلات في الملف ده تبع أي سنة؟ (اكتب سنة بالأرقام)', String(new Date().getFullYear()));
  if (yearInput === null) return;
  const year = parseInt(arabicToLatinDigits(yearInput).trim(), 10);
  if (!year || year < 2000 || year > 2100) { alert('سنة غير صحيحة، جرّب تاني'); return; }

  const btn = document.getElementById('import-btn');
  const originalText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري الاستيراد...'; }
  try {
    const buffer = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buffer);
    const ws = wb.worksheets[0];
    if (!ws) { alert('تعذر قراءة الملف، تأكد إنه ملف إكسيل صحيح'); return; }

    let imported = 0, skipped = 0;
    ws.eachRow({includeEmpty: false}, (row, rowNumber) => {
      if (rowNumber === 1) return; // header
      const idxVal = row.getCell(1).value;
      if (typeof idxVal !== 'number') return; // section titles / spacers / empty-section messages

      const dateText = row.getCell(2).value;
      const areaName = row.getCell(3).value;
      const shopName = cleanCell(row.getCell(4).value);
      const clientName = cleanCell(row.getCell(5).value);
      const phone = cleanCell(row.getCell(6).value);
      const address = cleanCell(row.getCell(7).value);
      const visitResultKey = parseVisitResultKey(row.getCell(8).value);
      const notes = cleanCell(row.getCell(9).value);
      const timeText = row.getCell(10).value;

      if (!shopName || !visitResultKey) { skipped++; return; }
      const time = parseArabicDateTime(dateText, timeText, year) || new Date();
      const areaId = findOrCreateAreaByName(areaName);

      entries.push({
        id: uid('e'),
        areaId,
        shopName,
        clientName,
        phone,
        address,
        visitResult: visitResultKey,
        notes,
        photo: null,
        time: time.toISOString(),
        followUps: [],
        contacted: false
      });
      imported++;
    });

    saveData(); render();
    alert('تم استيراد ' + imported + ' سجل بنجاح.' + (skipped > 0 ? ' (' + skipped + ' صف اتجاهل لأنه مش سجل بيانات).' : ''));
  } catch (err) {
    console.error(err);
    alert('حدث خطأ أثناء قراءة الملف. تأكد إنه نفس ملف الإكسيل اللي بيصدّره التطبيق.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = originalText; }
  }
}

/* ---------------- Render ---------------- */
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  document.getElementById('root').innerHTML = buildApp();

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}

function buildFollowupTab(){

  if (months.length && months.indexOf(selectedFollowupMonth) === -1) selectedFollowupMonth = months[0];

  const list = downAll
    .filter(e => monthKey(new Date(e.time)) === selectedFollowupMonth)
    .sort((a,b) => new Date(b.time) - new Date(a.time));
  const contactedCount = list.filter(e => e.contacted).length;

  const monthSelect = months.length
    ? '<select class="followup-select" onchange="selectedFollowupMonth=this.value; render();">'
      + months.map((m) => '<option value="' + m + '"' + (m === selectedFollowupMonth ? ' selected' : '') + '>' + monthLabelFromKey(m) + '</option>').join('')
      + '</select>'
    : '';

  return '<div class="section-card">'
    + '<div class="section-title"><span>عملاء الإنزال للمتابعة</span>' + monthSelect + '</div>'
    + (list.length === 0
        ? '<div class="empty-state">لا يوجد عملاء بنتيجة "إنزال" في هذا الشهر بعد.</div>'
        : '<div style="font-size:11.5px;color:#7C8C86;margin-bottom:10px;">تم التواصل مع ' + contactedCount + ' من ' + list.length + '</div>'
          + list.map(buildFollowupCard).join(''))
    + '</div>';
}

    + notesHtml
    + '<div class="followup-actions">'
    + '<button class="followup-mini-btn' + (e.contacted ? ' contacted' : '') + '" onclick="toggleContacted(\'' + e.id + '\')">' + (e.contacted ? '✓ تم التواصل' : 'تحديد كمتواصل') + '</button>'
    + '<button class="followup-mini-btn" onclick="startFollowUp(\'' + e.id + '\')">➕ ملاحظة متابعة</button>'
    + '</div>'
    + (isDraft
        ? '<div style="margin-top:8px;">'
          + '<textarea class="select-field" placeholder="اكتب ملاحظة المتابعة..." oninput="followUpDraftText=this.value">' + esc(followUpDraftText) + '</textarea>'
          + '<div class="followup-actions">'
          + '<button class="followup-mini-btn contacted" onclick="saveFollowUp(\'' + e.id + '\')">💾 حفظ</button>'
          + '<button class="followup-mini-btn" onclick="cancelFollowUp()">إلغاء</button>'
          + '</div></div>'
        : '')
    + '</div>';
}

/* ---------------- Init ---------------- */
loadData();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => console.log('SW registration failed', e));
  });
}
</script>
</body>
</html>
