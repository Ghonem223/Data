<script>
/* ---------------- State & Helpers ---------------- */
const WEEKDAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const VISIT_RESULTS = {
  down:     {label: 'إنزال',       chipClass: 'vr-chip-down',    badgeClass: 'visit-badge-down',    emoji: '✅', color: '#5DCAA5'},
  active:   {label: 'شغال معانا',  chipClass: 'vr-chip-active',  badgeClass: 'visit-badge-active',  emoji: '🤝', color: '#7CB2EE'},
  thinking: {label: 'هيفكر',       chipClass: 'vr-chip-think',   badgeClass: 'visit-badge-think',   emoji: '⏳', color: '#EF9F27'},
  rejected: {label: 'رفض',         chipClass: 'vr-chip-reject',  badgeClass: 'visit-badge-reject',  emoji: '❌', color: '#F0908F'}
};

let viewDate = new Date().toISOString().split('T')[0];
let areas = [];
let entries = [];
let callCenterCards = [];
let followUps = [];
let archive = []; 
let currentAreaId = '';
let currentPhoto = null;
let currentVisitResult = '';
let currentTab = 'home';
let ccSearchQuery = '';
let convertingCallCenterCardId = null;
let editingEntryId = null;
let locatingInProgress = false;

let archiveSearchQuery = '';
let archiveFilter = 'all';

let importDrafts = [];
let importModalTitle = 'مراجعة البيانات المستخرجة';
let newFieldNameDraft = '';

const CC_FIELD_KEYWORDS = {
  shopName: ['اسم المحل', 'المحل', 'shop', 'store', 'business name'],
  clientName: ['اسم العميل', 'العميل', 'client'],
  phone: ['تليفون', 'موبايل', 'هاتف', 'رقم الهاتف', 'phone', 'mobile'],
  machineNumber: ['رقم المكنة', 'مكنة', 'ماكينة', 'machine', 'pos', 'terminal']
};
function matchKnownCCField(label){
  const l = (label || '').toString().trim().toLowerCase();
  if (!l) return null;
  for (const key in CC_FIELD_KEYWORDS){
    if (CC_FIELD_KEYWORDS[key].some(kw => l.includes(kw.toLowerCase()))) return key;
  }
  return null;
}

let entryDraft = {shopName: '', clientName: '', phone: '', address: '', notes: '', locationLink: ''};
let areaDraft = '';

function uid(p){ return p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}); }

function archiveUpsert(type, linkId, obj){
  const area = areas.find(a => a.id === (obj.areaId || ''));
  const payload = {
    shopName: obj.shopName || '',
    clientName: obj.clientName || '',
    phone: obj.phone || '',
    address: obj.address || '',
    areaName: area ? area.name : (obj.areaName || ''),
    visitResult: obj.visitResult || '',
    notes: obj.notes || '',
    photo: obj.photo || null,
    locationLink: obj.locationLink || '',
    extraFields: obj.extraFields || [],
    time: obj.time || new Date().toISOString()
  };
  const existing = archive.find(a => a.type === type && a.linkId === linkId);
  if (existing) {
    Object.assign(existing, payload);
    existing.updatedAt = new Date().toISOString();
  } else {
    archive.push(Object.assign({id: uid('arc'), type, linkId, archivedAt: new Date().toISOString()}, payload));
  }
}

function deleteArchiveItem(id){
  if (!confirm('حذف نهائي من الأرشيف؟ الإجراء ده مش هينفع يتراجع عنه، والداتا مش هتفضل موجودة في أي مكان تاني.')) return;
  archive = archive.filter(a => a.id !== id);
  saveData(); render();
}

async function backfillArchiveIfNeeded(){
  try {
    const flag = await idbGet('global', 'archiveBackfilled');
    if (flag) return;
    callCenterCards.forEach(c => archiveUpsert('callcenter', c.id, c));
    followUps.forEach(f => archiveUpsert('followup', f.id, f));
    const all = await idbGetAllEntries('daily');
    all.forEach(({key, value}) => {
      if (value && value.entries) {
        value.entries.forEach(e => archiveUpsert('visit', e.id, e));
      }
    });
    await idbSet('global', 'archiveBackfilled', true);
    await saveData();
  } catch (e) { console.error('Archive backfill error', e); }
}

const DB_NAME = 'fielddata-db';
const DB_VERSION = 1;
let _dbPromise = null;

function openDB(){
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('global')) db.createObjectStore('global');
      if (!db.objectStoreNames.contains('daily')) db.createObjectStore('daily');
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
  return _dbPromise;
}
function idbGet(store, key){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function idbSet(store, key, value){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  }));
}
function idbGetAllEntries(store){
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const os = tx.objectStore(store);
    const keysReq = os.getAllKeys();
    const valsReq = os.getAll();
    tx.oncomplete = () => {
      const out = [];
      for (let i = 0; i < keysReq.result.length; i++) out.push({key: keysReq.result[i], value: valsReq.result[i]});
      resolve(out);
    };
    tx.onerror = () => reject(tx.error);
  }));
}

async function migrateFromLocalStorageIfNeeded(){
  try {
    const already = await idbGet('global', 'migrated');
    if (already) return;
    const rawGlobal = localStorage.getItem('fielddata-global');
    if (rawGlobal) await idbSet('global', 'main', JSON.parse(rawGlobal));
    for (let i = 0; i < localStorage.length; i++){
      const key = localStorage.key(i);
      if (key && key.startsWith('fielddata-data-')){
        const dateStr = key.replace('fielddata-data-', '');
        await idbSet('daily', dateStr, JSON.parse(localStorage.getItem(key)));
      }
    }
    await idbSet('global', 'migrated', true);
  } catch (e) { console.error('Migration error', e); }
}

async function loadData(){
  try {
    const g = await idbGet('global', 'main');
    if (g) {
      areas = g.areas || [];
      callCenterCards = g.callCenterCards || [];
      followUps = g.followUps || [];
      archive = g.archive || [];
    }
    const d = await idbGet('daily', viewDate);
    if (d) {
      entries = d.entries || [];
      currentAreaId = d.currentAreaId || '';
    } else {
      entries = [];
      currentAreaId = '';
    }
  } catch (e) { console.error('Load Error', e); }
}

let saveErrorShown = false;
async function saveData(){
  try {
    await idbSet('global', 'main', {areas, callCenterCards, followUps, archive});
    await idbSet('daily', viewDate, {entries, currentAreaId});
    saveErrorShown = false;
    maybeAutoBackup();
  } catch (e) {
    console.error('Storage Error', e);
    if (!saveErrorShown) {
      saveErrorShown = true;
      alert('⚠️ حصل خطأ في حفظ البيانات على الجهاز. خد نسخة احتياطية فورًا من شاشة "التقارير" لحد ما تتأكد إن المشكلة اتحلت.');
    }
  }
}

async function changeDate(newDate) {
  await saveData();
  viewDate = newDate;
  await loadData();
  render();
}

function setTab(tab){ currentTab = tab; render(); }

function addArea(){
  if(!areaDraft) return;
  areas.push({id: uid('a'), name: areaDraft});
  areaDraft = '';
  saveData(); render();
}

function deleteArea(id, e){
  e.stopPropagation();
  if(!confirm('هل أنت متأكد من حذف هذه المنطقة؟')) return;
  areas = areas.filter(a => a.id !== id);
  if(currentAreaId === id) currentAreaId = '';
  saveData(); render();
}

function selectArea(id){ currentAreaId = (currentAreaId === id) ? '' : id; saveData(); render(); }

function handlePhotoInput(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const MAX_DIM = 1280;
      let w = img.width, h = img.height;
      const scale = Math.min(1, MAX_DIM / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      currentPhoto = { dataUrl, width: w, height: h };
      render();
    };
    img.onerror = () => { currentPhoto = { dataUrl: e.target.result }; render(); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function requestLocation(){
  if (!navigator.geolocation) { alert('الجهاز ده مش بيدعم تحديد الموقع'); return; }
  locatingInProgress = true;
  render();
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    entryDraft.locationLink = 'https://www.google.com/maps?q=' + lat + ',' + lon;
    try {
      const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon + '&accept-language=ar&zoom=18');
      const data = await res.json();
      entryDraft.address = (data && data.display_name) ? data.display_name : (lat.toFixed(6) + ', ' + lon.toFixed(6));
    } catch (err) {
      entryDraft.address = lat.toFixed(6) + ', ' + lon.toFixed(6);
    }
    locatingInProgress = false;
    render();
  }, (err) => {
    locatingInProgress = false;
    alert('تعذر تحديد الموقع: ' + (err && err.message ? err.message : 'تأكد من تفعيل صلاحية الموقع للمتصفح'));
    render();
  }, {enableHighAccuracy: true, timeout: 15000});
}
function clearLocation(){
  entryDraft.locationLink = '';
  render();
}

function editEntry(id) {
    const entry = entries.find(e => e.id === id);
    if(!entry) return;
    editingEntryId = id;
    entryDraft = { 
        shopName: entry.shopName, 
        c
